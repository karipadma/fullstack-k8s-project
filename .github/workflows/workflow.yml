
name: Build and Deploy to EKS

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: 016065103695.dkr.ecr.us-east-1.amazonaws.com
  EKS_CLUSTER_NAME: my-eks-cluster

jobs:

  build-and-deploy:
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout GitHub repository
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Authenticate GitHub Actions with AWS using OIDC
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::016065103695:role/GitHubActionsRole
          aws-region: ${{ env.AWS_REGION }}

      # 3. Login Docker to Amazon ECR
      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      # 4. Build frontend Docker image
      - name: Build frontend image
        run: |
          docker build \
            -t $ECR_REGISTRY/frontend:${{ github.sha }} \
            ./frontend

      # 5. Push frontend image to ECR
      - name: Push frontend image
        run: |
          docker push \
            $ECR_REGISTRY/frontend:${{ github.sha }}

      # 6. Build backend Docker image
      - name: Build backend image
        run: |
          docker build \
            -t $ECR_REGISTRY/backend:${{ github.sha }} \
            ./backend

      # 7. Push backend image to ECR
      - name: Push backend image
        run: |
          docker push \
            $ECR_REGISTRY/backend:${{ github.sha }}

      # 8. Configure kubectl for EKS
      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region $AWS_REGION \
            --name $EKS_CLUSTER_NAME

      # 9. Apply frontend Service
      - name: Apply frontend Service
        run: |
          kubectl apply -f frontend/service.yaml

      # 10. Apply backend Service
      - name: Apply backend Service
        run: |
          kubectl apply -f backend/service.yaml

      # 11. Apply frontend Deployment
      - name: Apply frontend Deployment
        run: |
          kubectl apply -f frontend/deployment.yaml

      # 12. Apply backend Deployment
      - name: Apply backend Deployment
        run: |
          kubectl apply -f backend/deployment.yaml

      # 13. Update frontend to the new image
      - name: Update frontend image
        run: |
          kubectl set image deployment/frontend-deployment \
            frontend=$ECR_REGISTRY/frontend:${{ github.sha }}

      # 14. Update backend to the new image
      - name: Update backend image
        run: |
          kubectl set image deployment/backend-deployment \
            backend=$ECR_REGISTRY/backend:${{ github.sha }}

      # 15. Wait for frontend rollout
      - name: Verify frontend
        run: |
          kubectl rollout status deployment/frontend-deployment

      # 16. Wait for backend rollout
      - name: Verify backend
        run: |
          kubectl rollout status deployment/backend-deployment

      # 17. Show running Pods
      - name: Verify Pods
        run: |
          kubectl get pods

      # 18. Show Services
      - name: Verify Services
        run: |
          kubectl get svc

